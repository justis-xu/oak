[project]
name = "oak-repro"
version = "0.1.0"
description = "Reproduction of OaK (ontology-as-a-kernel) on TravelPlanner"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "networkx>=3.0",
    "owlready2>=0.46",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "datasets>=2.20",
    "tqdm>=4.66",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oak"]
